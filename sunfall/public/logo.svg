<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sf-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbf4"/>
      <stop offset="1" stop-color="#ead5b9"/>
    </linearGradient>
    <linearGradient id="sf-band" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#efe6dc"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="sf-disc"><circle cx="66" cy="48" r="42"/></clipPath>
  </defs>
  <!-- the sun's cap, cut by a curve that follows the falling bands -->
  <g clip-path="url(#sf-disc)">
    <path d="M0 0H120V46C96 37 66 37 24 49Z" fill="url(#sf-sun)"/>
  </g>
  <!-- falling light: bands sweep from the sun's right edge out past its left side and curve down -->
  <g stroke="url(#sf-band)" stroke-linecap="round" fill="none">
    <path d="M107.5 52C88 45 52 45 11 58" stroke-width="4.4"/>
    <path d="M107 61C86 55 52 56 10 70" stroke-width="4.1"/>
    <path d="M104 70C84 65 52 67 12 82" stroke-width="3.7"/>
    <path d="M98.5 78C80 74 54 77 20 92" stroke-width="3.3"/>
    <path d="M89 85C74 83 58 86 36 97" stroke-width="2.8"/>
  </g>
</svg>
